<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>VERTEX 画面验收工具（不记录成绩）</title><style>body{margin:0;font:13px system-ui;background:#dbe9ef;color:#24384a}canvas{width:100vw;height:100vh;display:block}nav{position:fixed;top:12px;left:12px;background:#fffffff0;padding:12px;max-width:90vw;border-radius:5px}button,select{padding:8px;margin:3px;border:1px solid #a9bdc7;background:white;cursor:pointer}p{margin:8px 4px}#cross{position:fixed;top:50%;left:50%;width:10px;height:10px;transform:translate(-50%,-50%);border:1px solid #ef8543;border-radius:50%}</style></head><body><canvas id="view"></canvas><div id="cross"></div><nav><b>画面验收工具 · 仅检查模型与资源，不代表通关</b><p><button data-gun="0">手枪</button><button data-gun="1">步枪</button><button data-gun="2">霰弹枪</button></p><p><button data-pose="idle">持握</button><button data-pose="shot">开火瞬间</button><button data-pose="reload">换弹中段</button><button data-pose="pump">泵动中段</button><button data-pose="ads">瞄准</button><button id="stress">场景重建 20 次</button></p><p id="result">等待装载</p></nav><script type="module" src="visual.mjs"></script></body></html>
