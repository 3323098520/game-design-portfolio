<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="烽火地带局内外系统全景"><rect width="100%" height="100%" fill="#fbfaf7"/><text x="70" y="70" font-family="Microsoft YaHei,sans-serif" font-size="40" font-weight="700" fill="#172124" dominant-baseline="middle" text-anchor="start">局外准备决定带什么进去 局内撤离决定什么能够留下</text><rect x="60" y="160" width="473" height="130" rx="15" fill="#fff" stroke="#cbd2d0" stroke-width="2"/><text x="296" y="205" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#3f6f62" dominant-baseline="middle" text-anchor="middle">任务与设施</text><text x="296" y="251" font-family="Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#5d686a" dominant-baseline="middle" text-anchor="middle">材料需求与阶段目标</text><rect x="563" y="160" width="473" height="130" rx="15" fill="#fff" stroke="#cbd2d0" stroke-width="2"/><text x="799" y="205" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#3f6f62" dominant-baseline="middle" text-anchor="middle">仓库与交易</text><text x="799" y="251" font-family="Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#5d686a" dominant-baseline="middle" text-anchor="middle">库存 购买 出售</text><rect x="1066" y="160" width="473" height="130" rx="15" fill="#fff" stroke="#cbd2d0" stroke-width="2"/><text x="1302" y="205" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#3f6f62" dominant-baseline="middle" text-anchor="middle">配装预算</text><text x="1302" y="251" font-family="Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#5d686a" dominant-baseline="middle" text-anchor="middle">枪 弹 甲 药 容量</text><rect x="60" y="445" width="473" height="130" rx="15" fill="#fff" stroke="#cbd2d0" stroke-width="2"/><text x="296" y="490" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#3f6f62" dominant-baseline="middle" text-anchor="middle">搜索与任务</text><text x="296" y="536" font-family="Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#5d686a" dominant-baseline="middle" text-anchor="middle">提高收益 改写目标</text><rect x="563" y="445" width="473" height="130" rx="15" fill="#fff" stroke="#cbd2d0" stroke-width="2"/><text x="799" y="490" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#3f6f62" dominant-baseline="middle" text-anchor="middle">交战与干员</text><text x="799" y="536" font-family="Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#5d686a" dominant-baseline="middle" text-anchor="middle">改变信息 位置 状态</text><rect x="1066" y="445" width="473" height="130" rx="15" fill="#fff" stroke="#cbd2d0" stroke-width="2"/><text x="1302" y="490" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#3f6f62" dominant-baseline="middle" text-anchor="middle">路线与撤离</text><text x="1302" y="536" font-family="Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#5d686a" dominant-baseline="middle" text-anchor="middle">兑现收益或承担损失</text><polyline points="296,290 296,400" fill="none" stroke="#3f6f62" stroke-width="4"/><polygon points="296,400 285.4526381507075,380.6931836384118 306.5473618492925,380.6931836384118" fill="#3f6f62"/><polyline points="799,290 799,400" fill="none" stroke="#3f6f62" stroke-width="4"/><polygon points="799,400 788.4526381507076,380.6931836384118 809.5473618492924,380.6931836384118" fill="#3f6f62"/><polyline points="1302,290 1302,400" fill="none" stroke="#3f6f62" stroke-width="4"/><polygon points="1302,400 1291.4526381507076,380.6931836384118 1312.5473618492924,380.6931836384118" fill="#3f6f62"/><polyline points="296,575 296,755" fill="none" stroke="#3f6f62" stroke-width="4"/><polygon points="296,755 285.4526381507075,735.6931836384118 306.5473618492925,735.6931836384118" fill="#3f6f62"/><polyline points="799,575 799,755" fill="none" stroke="#3f6f62" stroke-width="4"/><polygon points="799,755 788.4526381507076,735.6931836384118 809.5473618492924,735.6931836384118" fill="#3f6f62"/><polyline points="1302,575 1302,755" fill="none" stroke="#3f6f62" stroke-width="4"/><polygon points="1302,755 1291.4526381507076,735.6931836384118 1312.5473618492924,735.6931836384118" fill="#3f6f62"/><polyline points="140,755 1460,755" fill="none" stroke="#82908d" stroke-width="3"/><text x="800" y="815" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#394648" dominant-baseline="middle" text-anchor="middle">结算回到仓库 再形成下一局需求</text></svg>