<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="满包撤离的两条假设路线"><rect width="100%" height="100%" fill="#fbfaf7"/><text x="70" y="70" font-family="Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#172124" dominant-baseline="middle" text-anchor="start">假设地形 不对应真实地图点位</text><rect x="610" y="210" width="320" height="440" rx="15" fill="#ccd5cf" stroke="#aab6b0" stroke-width="2"/><text x="770" y="430" font-family="Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#43504d" dominant-baseline="middle" text-anchor="middle">建筑遮挡</text><rect x="1160" y="170" width="310" height="110" rx="15" fill="#f0dddd" stroke="#bb7777" stroke-width="2"/><text x="1315" y="225" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#8c4545" dominant-baseline="middle" text-anchor="middle">疑似敌方枪线</text><rect x="1210" y="650" width="290" height="120" rx="15" fill="#e8f0ed" stroke="#3f6f62" stroke-width="2"/><text x="1355" y="710" font-family="Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#3f6f62" dominant-baseline="middle" text-anchor="middle">撤离方向</text><rect x="90" y="170" width="260" height="120" rx="15" fill="#fff" stroke="#cbd2d0" stroke-width="2"/><text x="220" y="215" font-family="Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#3f6f62" dominant-baseline="middle" text-anchor="middle">满包三人小队</text><text x="220" y="255" font-family="Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#5d686a" dominant-baseline="middle" text-anchor="middle">一人受伤</text><polyline points="350,220 1080,220 1260,610" fill="none" stroke="#3f6f62" stroke-width="7"/><polygon points="1260,610 1242.332744550137,596.8901531332632 1261.4858968957114,588.0502366660751" fill="#3f6f62"/><text x="750" y="165" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="700" fill="#3f6f62" dominant-baseline="middle" text-anchor="middle">A 短但暴露</text><polyline points="220,290 220,720 1160,720" fill="none" stroke="#3f6f62" stroke-width="7" stroke-dasharray="12 10"/><polygon points="1160,720 1140.6931836384117,730.5473618492924 1140.6931836384117,709.4526381507076" fill="#3f6f62"/><text x="650" y="775" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="700" fill="#3f6f62" dominant-baseline="middle" text-anchor="middle">B 遮挡多 但出口和耗时未知</text><polyline points="1180,275 930,420" fill="none" stroke="#a74c4c" stroke-width="5" stroke-dasharray="12 10"/><polygon points="930,420 941.4091960789644,401.1896240114201 951.9928005572833,419.4372179395562" fill="#a74c4c"/></svg>