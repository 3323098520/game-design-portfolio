<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="从配装到结算的风险收益循环"><rect width="100%" height="100%" fill="#fbfaf7"/><text x="70" y="70" font-family="Microsoft YaHei,sans-serif" font-size="40" font-weight="700" fill="#172124" dominant-baseline="middle" text-anchor="start">每一步都在重估收益 成本与撤离概率</text><rect x="60" y="310" width="221" height="130" rx="15" fill="#fff" stroke="#cbd2d0" stroke-width="2"/><text x="170" y="355" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#3f6f62" dominant-baseline="middle" text-anchor="middle">战前配装</text><text x="170" y="401" font-family="Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#5d686a" dominant-baseline="middle" text-anchor="middle">确定成本 C</text><rect x="311" y="310" width="221" height="130" rx="15" fill="#fff" stroke="#cbd2d0" stroke-width="2"/><text x="421" y="355" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#3f6f62" dominant-baseline="middle" text-anchor="middle">进入战区</text><text x="421" y="401" font-family="Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#5d686a" dominant-baseline="middle" text-anchor="middle">信息不完整</text><rect x="562" y="310" width="221" height="130" rx="15" fill="#fff" stroke="#cbd2d0" stroke-width="2"/><text x="672" y="355" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#3f6f62" dominant-baseline="middle" text-anchor="middle">搜索取舍</text><text x="672" y="401" font-family="Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#5d686a" dominant-baseline="middle" text-anchor="middle">提高 V 与 G</text><rect x="813" y="310" width="221" height="130" rx="15" fill="#fff" stroke="#cbd2d0" stroke-width="2"/><text x="923" y="355" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#3f6f62" dominant-baseline="middle" text-anchor="middle">接战或绕行</text><text x="923" y="401" font-family="Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#5d686a" dominant-baseline="middle" text-anchor="middle">改变 p 与消耗</text><rect x="1064" y="310" width="221" height="130" rx="15" fill="#fff" stroke="#cbd2d0" stroke-width="2"/><text x="1174" y="355" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#3f6f62" dominant-baseline="middle" text-anchor="middle">撤离判定</text><text x="1174" y="401" font-family="Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#5d686a" dominant-baseline="middle" text-anchor="middle">出口与时机</text><rect x="1315" y="310" width="221" height="130" rx="15" fill="#fff" stroke="#cbd2d0" stroke-width="2"/><text x="1425" y="355" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#3f6f62" dominant-baseline="middle" text-anchor="middle">资产结算</text><text x="1425" y="401" font-family="Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#5d686a" dominant-baseline="middle" text-anchor="middle">成功保留 失败损失</text><polyline points="280,375 311,375" fill="none" stroke="#3f6f62" stroke-width="5"/><polygon points="311,375 291.6931836384118,385.5473618492925 291.6931836384118,364.4526381507075" fill="#3f6f62"/><polyline points="531,375 562,375" fill="none" stroke="#3f6f62" stroke-width="5"/><polygon points="562,375 542.6931836384118,385.5473618492925 542.6931836384118,364.4526381507075" fill="#3f6f62"/><polyline points="782,375 813,375" fill="none" stroke="#3f6f62" stroke-width="5"/><polygon points="813,375 793.6931836384118,385.5473618492925 793.6931836384118,364.4526381507075" fill="#3f6f62"/><polyline points="1033,375 1064,375" fill="none" stroke="#3f6f62" stroke-width="5"/><polygon points="1064,375 1044.6931836384117,385.5473618492925 1044.6931836384117,364.4526381507075" fill="#3f6f62"/><polyline points="1284,375 1315,375" fill="none" stroke="#3f6f62" stroke-width="5"/><polygon points="1315,375 1295.6931836384117,385.5473618492925 1295.6931836384117,364.4526381507075" fill="#3f6f62"/><text x="800" y="650" font-family="Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#3f6f62" dominant-baseline="middle" text-anchor="middle">价值越高 不一定越想继续打 技能也可能被用于避战</text></svg>