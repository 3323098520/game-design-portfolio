<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="信息到执行的回合循环"><rect width="100%" height="100%" fill="#fbfaf7"/><text x="70" y="70" font-family="Microsoft YaHei,sans-serif" font-size="40" font-weight="700" fill="#172124" dominant-baseline="middle" text-anchor="start">技能不是终点 反馈必须重新进入计划</text><rect x="110" y="155" width="380" height="150" rx="15" fill="#fff" stroke="#9b3747" stroke-width="2"/><text x="300" y="210" font-family="Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#9b3747" dominant-baseline="middle" text-anchor="middle">信息</text><text x="300" y="260" font-family="Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#5d686a" dominant-baseline="middle" text-anchor="middle">敌位 枪线 资源</text><rect x="910" y="155" width="380" height="150" rx="15" fill="#fff" stroke="#9b3747" stroke-width="2"/><text x="1100" y="210" font-family="Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#9b3747" dominant-baseline="middle" text-anchor="middle">计划</text><text x="1100" y="260" font-family="Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#5d686a" dominant-baseline="middle" text-anchor="middle">处理顺序与分工</text><rect x="910" y="545" width="380" height="150" rx="15" fill="#fff" stroke="#9b3747" stroke-width="2"/><text x="1100" y="600" font-family="Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#9b3747" dominant-baseline="middle" text-anchor="middle">执行</text><text x="1100" y="650" font-family="Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#5d686a" dominant-baseline="middle" text-anchor="middle">技能 移动 射击</text><rect x="110" y="545" width="380" height="150" rx="15" fill="#fff" stroke="#9b3747" stroke-width="2"/><text x="300" y="600" font-family="Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#9b3747" dominant-baseline="middle" text-anchor="middle">反馈</text><text x="300" y="650" font-family="Microsoft YaHei,sans-serif" font-