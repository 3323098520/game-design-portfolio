<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="安装前后目标与时间压力反转"><rect width="100%" height="100%" fill="#fbfaf7"/><text x="70" y="70" font-family="Microsoft YaHei,sans-serif" font-size="40" font-weight="700" fill="#172124" dominant-baseline="middle" text-anchor="start">地图没变 必须主动解决问题的一方变了</text><rect x="80" y="180" width="660" height="500" rx="15" fill="#fff" stroke="#9b3747" stroke-width="2"/><text x="410" y="230" font-family="Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#9b3747" dominant-baseline="middle" text-anchor="middle">安装前</text><rect x="860" y="180" width="660" height="500" rx="15" fill="#f4e9eb" stroke="#9b3747" stroke-width="2"/><text x="1190" y="230" font-family="Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#9b3747" dominant-baseline="middle" text-anchor="middle">安装后</text><text x="145" y="325" font-family="Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#273234" dominant-baseline="middle" text-anchor="start">进攻方</text><text x="145" y="375" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#596466" dominant-baseline="middle" text-anchor="start">进入安装区 清枪线 付出时间</text><text x="145" y="490" font-family="Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#273234" dominant-baseline="middle" text-anchor="start">防守方</text><text x="145" y="540" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#596466" dominant-baseline="middle" text-anchor="start">守住入口 延缓并消耗对手</text><text x="925" y="325" font-family="Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#273234" dominant-baseline="middle" text-anchor="start">防守方</text><text x="925" y="375" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#596466" dominant-baseline="middle" text-anchor="start">回到包点 拆除 承担时间压力</text><text x="925" y="490" font-family="Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#273234" dominant-baseline="middle" text-anchor="start">进攻方</text><text x="925" y="540" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#596466" dominant-baseline="middle" text-anchor="start">守包 拖延 迫使对方主动进入</text><polyline points="740,430 850,430" fill="none" stroke="#9b3747" stroke-width="8"/><polygon points="850,430 830.6931836384118,440.5473618492925 830.6931836384118,419.4526381507075" fill="#9b3747"/></svg>